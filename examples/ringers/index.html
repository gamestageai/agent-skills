<!doctype html>
<html lang="en-GB" data-gs-theme="paper" data-gs-context="light" style="background:#F7F7F5">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<meta name="theme-color" content="#F7F7F5" />
<!-- The deploy writes the intro screen here, from gamestage.settings.json. GS-564. -->
<meta name="color-scheme" content="light" data-gs-first-paint />
<title>Ringers</title>
<link rel="icon" href="./favicon.svg" type="image/svg+xml" />
<style>
  /* First paint, before any script: the game's own paper and a centred loading
     mark, so a native app's web view never flashes a different colour. */
  html, body { margin: 0; height: 100%; background: #F7F7F5; color: #111; overscroll-behavior: none; }
  #boot { position: fixed; inset: 0; display: grid; place-items: center; }
  #boot i { width: 36px; height: 36px; border-radius: 50%; border: 3px solid rgba(17,17,17,.12); border-top-color: #111; animation: spin .8s linear infinite; }
  @keyframes spin { to { transform: rotate(360deg) } }
  @media (prefers-reduced-motion: reduce) { #boot i { animation: none; } }
</style>
<script>
  window.__gamestage = new Promise((resolve, reject) => {
    window.__gamestageLoaded = resolve;
    window.__gamestageFailed = reject;
  });
</script>
<script type="module" vite-ignore>
  import * as client from "https://gamestage.ai/client/0.66.20/gamestage.js";
  window.__gamestageLoaded(client);
</script>
<script vite-ignore>
  window.addEventListener("error", (event) => {
    if (event.target instanceof HTMLScriptElement && /gamestage\.js/.test(event.target.src || "")) {
      window.__gamestageFailed?.(new Error("This game could not load its Gamestage client."));
    }
  }, true);
</script>
</head>
<body>
  <div id="boot" aria-hidden="true"><i></i></div>
  <div id="root"></div>
  <script type="module" src="/src/main.tsx"></script>
</body>
</html>
