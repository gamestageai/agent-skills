# Local practice only. Live rounds remain managed in Studio.
archetype: bingo
number: 1
prompt: Pick your matchday board. Every completed row, column or diagonal scores
  25 points, with 100 extra for a full board.
rows: 3
columns: 3
centreMode: free
lineTypes:
  - row
  - column
  - diagonal
pointsPerLine: 25
pointsForFullBoard: 100
shuffleAllowance: 3
cardPool:
  - key: Goal in the first 10
    label: Goal in the first 10
    note: A goal is awarded before the match clock reaches 10:00.
  - key: Penalty awarded
    label: Penalty awarded
    note: The referee awards a penalty during normal time or stoppage time. A
      shoot-out does not count.
  - key: Own goal
    label: Own goal
    note: A goal is officially recorded as an own goal.
  - key: Red card
    label: Red card
    note: A player is sent off, including for a second yellow card.
  - key: Booked for dissent
    label: Booked for dissent
    note: A player receives a yellow card for dissent.
  - key: Header from a corner
    label: Header from a corner
    note: A goal is scored with a header directly from a corner.
  - key: Free kick on target
    label: Free kick on target
    note: A direct free kick produces a goal or a save by the goalkeeper.
  - key: Off the woodwork
    label: Off the woodwork
    note: A shot hits a post or the crossbar without first crossing the goal line.
  - key: Substitute scores
    label: Substitute scores
    note: A player who entered as a substitute scores.
  - key: Goal from outside the box
    label: Goal from outside the box
    note: A goal is scored from a shot taken outside the penalty area.
  - key: VAR check
    label: VAR check
    note: The referee reviews an incident on the pitch-side VAR monitor.
  - key: Offside flag in the first half
    label: Offside flag in the first half
    note: An offside offence is given before the half-time whistle.
  - key: Manager booked
    label: Manager booked
    note: A manager receives a yellow or red card.
  - key: Goal in injury time
    label: Goal in injury time
    note: A goal is scored during added time at the end of either half.
  - key: Both teams score
    label: Both teams score
    note: Each team scores at least one goal in the match.
  - key: Corner in the first five
    label: Corner in the first five
    note: A corner is awarded before the match clock reaches 5:00.
  - key: Half-time substitution
    label: Half-time substitution
    note: A substitute comes on during the half-time interval.
  - key: Three goals or more
    label: Three goals or more
    note: At least three goals are scored in total.
